<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Cinema Torino</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎬%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Colori: un solo significato per colore.
   ambra = selezionato / azione principale · menta = prossimo spettacolo · azzurro = link · il resto è neutro */
:root{
  --bg:#12161b; --surface:#1a2028; --raised:#252d38; --line:#2c3541; --ink:#e9eef3; --mute:#8896a5;
  --amber:#ffab2e; --amber-ink:#1c1200; --mint:#3ddc84; --sky:#58b7ff;
  --warn-bg:#3a2f10; --warn-ink:#ffd37a; --r:16px;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f1f3f5; --surface:#ffffff; --raised:#eceff3; --line:#dde2e8; --ink:#14181c; --mute:#5d6b79;
  --amber:#e07b00; --amber-ink:#ffffff; --mint:#08904a; --sky:#1565c0; --warn-bg:#fff4d6; --warn-ink:#6a4b00}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-feature-settings:"cv11","ss03";
  padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* ---- intestazione compatta ---- */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:6px;padding:10px 0 6px}
h1{font-size:17px;margin:0;letter-spacing:-.03em;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;width:42px;height:44px;flex:none;border:0;border-radius:12px;background:var(--surface);color:var(--ink);
  display:grid;place-items:center;cursor:pointer}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-expanded=true]{background:var(--raised)}
.ib.on::after{content:"";position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.seg{display:inline-flex;background:var(--surface);border-radius:12px;padding:3px;height:44px}
.seg button{border:0;background:transparent;color:var(--mute);font-size:15px;font-weight:600;padding:0 11px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--amber);color:var(--amber-ink)}
.panel{padding:2px 0 12px}
#p-m{max-height:58vh;overflow-y:auto}
.panel[hidden]{display:none}
.panel input[type=search]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;height:48px;-webkit-appearance:none;appearance:none}
.panel input::placeholder{color:var(--mute)}
.panel input:focus{outline:2px solid var(--amber);outline-offset:0}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;font-size:15px}
.prow .mut{color:var(--mute);font-size:13px}
.toggle{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:500;cursor:pointer;user-select:none;min-height:44px}
.toggle input{accent-color:var(--amber);width:20px;height:20px}
.link{background:none;border:0;color:var(--sky);font:inherit;font-size:15px;font-weight:600;cursor:pointer;padding:10px 4px;min-height:44px}
.link[hidden]{display:none}
.plab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:6px 0 2px}
.cinema-chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 0}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--mute);font-size:14px;font-weight:600;
  padding:0 14px;min-height:40px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--raised);border-color:var(--amber);color:var(--ink)}
.cinema-chips .link{min-height:40px;padding:0 8px}

/* ---- settimana ---- */
#days{display:block;padding:0 0 10px}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 4px;font-size:13px;color:var(--mute);font-weight:500;min-height:30px}
.wk .link{font-size:13px;font-weight:600;padding:4px 0;min-height:30px}
.updl{margin:6px 0 0;font-size:12px;color:var(--mute);text-align:center}
.updl.old{color:var(--amber)}
.wk .link[hidden]{visibility:hidden;display:inline}
.dgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:54px;padding:6px 0;border:0;border-radius:14px;
  background:var(--surface);color:var(--ink);cursor:pointer}
.dc span{font-size:12px;font-weight:600;color:var(--mute)}
.dc b{font-size:19px;font-weight:700;line-height:1.15}
.dc[aria-pressed=true]{background:var(--amber);color:var(--amber-ink)}
.dc[aria-pressed=true] span{color:inherit;opacity:.85}
.dc:disabled{background:transparent;opacity:.4;cursor:default}

main{padding:14px 0 60px}
[data-back]{border:0;background:none;color:var(--sky);font:inherit;font-weight:700;cursor:pointer;padding:0 10px 0 0;min-height:44px}
.only{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 12px;padding:2px 14px;border-radius:12px;background:var(--surface);font-size:14px}
.only button{border:0;background:none;color:var(--sky);font:inherit;font-weight:600;cursor:pointer;padding:0;min-height:44px}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 14px;font-size:13px;margin:0 0 10px}
.warn a{color:inherit;font-weight:600}

/* ---- schede ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:0 0 12px;overflow:hidden}
summary.fh{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;padding:16px;cursor:pointer;list-style:none;position:relative}
summary.fh::-webkit-details-marker{display:none}
summary.fh::after{content:"";position:absolute;top:22px;right:18px;width:9px;height:9px;
  border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .15s}
.card:not([open])>summary.fh::after{transform:rotate(-45deg)}
.fm{flex:1;min-width:0;padding-right:22px}
.card h2{font-size:21px;font-weight:800;line-height:1.2;margin:0 0 4px;letter-spacing:-.025em;overflow-wrap:anywhere}
.card h2 .yr{font-size:15px;font-weight:500;color:var(--mute);margin-left:6px;letter-spacing:0}
.dir{font-size:15px;line-height:1.35;margin:0 0 2px}
.dir .lab{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mute);margin-right:6px}
.dir b{font-weight:600}
.meta{font-size:14px;color:var(--mute)}
.pbtn{flex:none;width:72px;height:108px;border:0;padding:0;border-radius:8px;overflow:hidden;background:var(--raised);
  cursor:zoom-in;display:block;transition:width .15s,height .15s;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.pbtn.nop{cursor:default}
.pbtn img{width:100%;height:100%;object-fit:cover;display:block}
.card[open] .pbtn{width:104px;height:156px}
.ph{display:flex;align-items:flex-end;width:100%;height:100%;padding:7px;font-size:11px;font-weight:800;letter-spacing:.02em;
  line-height:1.15;color:#fff;overflow:hidden;word-break:break-word;
  background:linear-gradient(160deg,hsl(var(--h) 42% 34%),hsl(var(--h) 45% 15%))}
.mini{flex:none;width:40px;height:60px;border-radius:6px;overflow:hidden;background:var(--raised)}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.mini .ph{align-items:center;justify-content:center;padding:0;font-size:14px}

/* anteprima da chiusa: i prossimi orari */
.prev{display:flex;flex-wrap:wrap;gap:6px;flex:1 0 100%;order:3;margin-top:-2px;align-items:center}
/* scheda film: locandina | titolo e trama; da telefono, a "Leggi tutto" aperto la trama passa sotto la locandina a tutta larghezza */
summary.fh:not(.chd){display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;row-gap:0;align-items:start}
summary.fh:not(.chd)>.pbtn{grid-column:1;grid-row:1 / span 2}
summary.fh:not(.chd)>.fm{grid-column:2;grid-row:1}
summary.fh:not(.chd)>.plotw{grid-column:2;grid-row:2;min-width:0}
summary.fh:not(.chd)>.prev{grid-column:1 / -1;grid-row:3;margin-top:10px}
@media (max-width:639px){.card.xo>summary.fh>.plotw{grid-column:1 / -1;grid-row:3;margin-top:12px}}
.card[open] .prev{display:none}
.pp{display:inline-flex;align-items:baseline;gap:6px;background:var(--raised);border-radius:9px;padding:4px 9px;
  border:2px solid transparent;font-size:14px;min-width:0;max-width:100%}
.pp b{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.pp em{font-style:normal;color:var(--mute);font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:84px}
.pp sup{font-size:9px;font-weight:800;color:var(--mute)}
.pp.next{border-color:var(--mint);background:transparent}
.pp.next b{color:var(--mint)}
.pm{font-size:13px;color:var(--mute);font-weight:500;padding:0 2px}

/* corpo scheda film: info subito sotto locandina e titolo */
.info{padding:0 16px 12px;font-size:13px}
.plotw{margin-top:8px}
.card:not([open]) .plotw{display:none}
.plotw .plot{font-size:14px;line-height:1.45;margin:0}
.plotw .more{padding:0;min-height:36px;font-size:14px}
.xinfo{display:none;padding:0 16px 14px}
.card.xo .xinfo{display:block}
.xinfo p.mut{color:var(--mute);font-size:13px;margin:0 0 10px;line-height:1.4}
select.zone{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;height:48px;padding:0 12px}
select.zone:focus{outline:2px solid var(--amber)}
.zhint{color:var(--mute);font-size:12px;margin:4px 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tag{background:var(--raised);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
.info p{margin:0 0 8px}
.info .mut{color:var(--mute);font-size:13px;line-height:1.4}
.plot{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;color:color-mix(in srgb,var(--ink) 90%,transparent)}
.plot.full{display:block}
.info .more{padding:0;min-height:36px;font-size:14px}
.dbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 16px;border-top:1px solid var(--line);min-height:52px}
.dbar span{color:var(--mute);font-size:14px;font-weight:500}
.dbar .link{padding:10px 0 10px 12px}
.dtabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dt{flex:none;border:0;background:var(--raised);color:var(--ink);font-size:14px;font-weight:600;padding:0 14px;min-height:40px;border-radius:999px;cursor:pointer}
.dt[aria-pressed=true]{background:var(--amber);color:var(--amber-ink)}
.row{padding:12px 16px;border-top:1px solid var(--line)}
.row .who{font-size:20px;font-weight:700;line-height:1.25;letter-spacing:-.015em;min-width:0}
.row .who a.cn{color:inherit;text-decoration:none}
.row .who a.ext{color:var(--mute);font-size:14px;font-weight:400;text-decoration:none;margin-left:4px}
.addr{display:block;font-size:13px;font-weight:400;color:var(--mute);letter-spacing:0;margin-top:1px;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--mute) 45%,transparent);text-underline-offset:3px}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.t{background:var(--raised);border-radius:9px;padding:6px 11px;font-size:15px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;border:2px solid transparent}
.t.past{color:var(--mute);text-decoration:line-through;font-weight:500;opacity:.55}
.t.next{border-color:var(--mint);color:var(--mint);background:transparent}
.t sup{font-size:9px;font-weight:800;margin-left:3px;color:var(--mute)}
.t i{font-style:normal;font-size:10px;font-weight:600;color:var(--mute);margin-left:5px;text-transform:uppercase}
.t.next sup,.t.next i{color:inherit;opacity:.8}
.none{color:var(--mute);font-size:14px;padding:4px 16px 16px}
.foot-in{padding:12px 16px 16px;border-top:1px solid var(--line)}
.foot-in p.mut{color:var(--mute);font-size:13px;margin:0 0 10px;line-height:1.4}
.ibtns{display:flex;gap:8px;flex-wrap:wrap}
.ibtn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;background:var(--raised);color:var(--sky);
  text-decoration:none;font-size:14px;font-weight:600}
.row .mw{display:flex;gap:12px;align-items:center}
a.ft{color:inherit;text-decoration:none}

/* ---- scheda cinema ---- */
.logo{width:52px;height:52px;border-radius:14px;flex:none;background:#fff;display:grid;place-items:center;overflow:hidden}
.logo img{width:36px;height:36px;object-fit:contain}
.logo.big img{width:100%;height:100%;padding:6px}
.logo.mono{color:#fff;font-weight:800;font-size:18px;letter-spacing:-.02em;background:linear-gradient(150deg,hsl(var(--h) 50% 40%),hsl(var(--h) 50% 22%))}
.chd .fm{display:flex;flex-direction:column;gap:2px;justify-content:center;min-height:52px}
.chd h2{margin:0}
.site{font-size:13px;font-weight:600;color:var(--sky);text-decoration:none}
.chd .addr{margin:0}
.card.cin .row:first-of-type{border-top:1px solid var(--line)}

.empty{color:var(--mute);text-align:center;padding:44px 12px;font-size:15px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
footer{color:var(--mute);font-size:12px;text-align:center;padding:0 16px 28px;line-height:1.5}
footer a{color:inherit}

/* ---- locandina a tutto schermo ---- */
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center;touch-action:none}
.lb[hidden]{display:none}
.lb img{max-width:94vw;max-height:86vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.lb button{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;width:48px;height:48px;border-radius:50%;border:0;
  background:rgba(255,255,255,.16);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center}

@keyframes slL{from{opacity:.3;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slR{from{opacity:.3;transform:translateX(-28px)}to{opacity:1;transform:none}}
#out.sl{animation:slL .18s ease-out}
#out.sr{animation:slR .18s ease-out}
@media (prefers-reduced-motion:reduce){#out.sl,#out.sr{animation:none}.pbtn{transition:none}}
@media (min-width:640px){.pbtn{width:84px;height:126px}.card[open] .pbtn{width:120px;height:180px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Cinema Torino</h1>
      <button type="button" class="ib" id="b-q" aria-label="Cerca un film" aria-expanded="false">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button type="button" class="ib" id="b-m" aria-label="Filtri e opzioni" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="seg" role="group" aria-label="Vista">
        <button id="v-film" aria-pressed="true">Film</button>
        <button id="v-cinema" aria-pressed="false">Cinema</button>
      </div>
    </div>
    <div class="panel" id="p-q" hidden>
      <input type="search" id="q" placeholder="Cerca un film…" aria-label="Cerca un film" autocomplete="off">
    </div>
    <div class="panel" id="p-m" hidden>
      <div id="zonebox" hidden>
        <div class="plab">La mia zona</div>
        <select id="zone" class="zone" aria-label="La mia zona"></select>
        <div class="zhint" id="zhint"></div>
      </div>
      <div class="prow"><label class="toggle"><input type="checkbox" id="fromnow" checked> Solo da ora</label>
        <button type="button" class="link" id="colall" hidden>Comprimi tutto</button></div>
      <div class="plab">Cinema <span id="fsum" style="text-transform:none;letter-spacing:0;font-weight:500"></span></div>
      <div class="cinema-chips" id="cchips"></div>
      <div class="prow"><span class="mut" id="upd"></span></div>
    </div>
    <div id="days" role="group" aria-label="Giorno"></div>
  </div>
</header>
<main class="wrap" id="out"><div class="empty">Caricamento…</div></main>
<footer id="foot"></footer>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Locandina"><img id="lbimg" alt=""><button type="button" id="lbx" aria-label="Chiudi">✕</button></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const REPO_URL = "";   // ← incolla qui il link al repository GitHub (es. "https://github.com/rotulair/NOME-REPO"): diventa il link nei crediti in fondo alla pagina
const TZ = "Europe/Rome";

const ZONES = [
  ["centro","Centro",45.0703,7.6869],["crocetta","Crocetta / San Secondo",45.0580,7.6640],["salvario","San Salvario",45.0550,7.6800],
  ["lingotto","Nizza Millefonti / Lingotto",45.0350,7.6650],["santarita","Santa Rita / Mirafiori Nord",45.0450,7.6430],
  ["mirafiori","Mirafiori Sud",45.0170,7.6290],["cenisia","Cenisia / San Paolo",45.0630,7.6510],
  ["sandonato","San Donato / Cit Turin / Campidoglio",45.0770,7.6600],["parella","Parella / Pozzo Strada",45.0700,7.6280],
  ["vittoria","Borgo Vittoria / Lucento / Madonna di Campagna",45.1030,7.6600],["barriera","Barriera di Milano / Aurora / Parco Dora",45.0850,7.6920],
  ["vanchiglia","Vanchiglia / Regio Parco",45.0780,7.7050],["borgopo","Borgo Po / Madonna del Pilone / Collina",45.0600,7.7060]];
let COORDS = {};
const state = { zone:"", data:null, day:null, dates:[], anim:"", depth:0, view:"film", q:"", only:"", onlyCinema:"", fromNow:true, hidden:new Set() };

/* ---------- utilità ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function romeNow(){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return { date:`${p.year}-${p.month}-${p.day}`, min:(+p.hour)*60 + (+p.minute) };
}
const toMin = t => { const [h,m]=t.split(":"); return (+h)*60+(+m); };
// gli spettacoli dopo mezzanotte (00:05) appartengono alla serata del giorno stesso: contano come "fine giornata"
const effMin = t => { const m = toMin(t); return m < 5*60 ? m + 24*60 : m; };

function dayLabel(iso, today){
  const d = new Date(iso+"T12:00:00Z"), t = new Date(today+"T12:00:00Z");
  const diff = Math.round((d - t)/864e5);
  if(diff===0) return "Oggi";
  if(diff===1) return "Domani";
  const wd = new Intl.DateTimeFormat("it-IT",{weekday:"short",timeZone:"UTC"}).format(d).replace(".","");
  return `${wd.charAt(0).toUpperCase()+wd.slice(1)} ${d.getUTCDate()}/${d.getUTCMonth()+1}`;
}

function prettyTitle(t){
  const letters = t.replace(/[^A-Za-zÀ-ÿ]/g,"");
  if(letters.length < 4 || letters !== letters.toUpperCase()) return t;   // già in maiuscolo/minuscolo "normale"
  // titoli italiani: maiuscola solo all'inizio e dopo i due punti ("Avengers: Doomsday")
  return t.toLowerCase().replace(/(^|:\s+|\(\s*)([a-zà-ÿ])/g,(m,a,b)=>a+b.toUpperCase());
}
function filmKey(t){
  return t.toLowerCase().replace(/\([^)]*\)|\[[^\]]*\]/g," ").replace(/\b(4k|ried|rid)\b/g," ")
    .normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
}
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue = s => { let h = 0; for(const c of String(s)) h = (h*31 + c.charCodeAt(0)) % 360; return h; };
const initials = s => { const w = String(s).replace(/[^A-Za-zÀ-ÿ0-9 ]/g," ").split(/\s+/).filter(Boolean); 
  return ((w[0]||"?")[0] + ((w.length>1 ? w[1] : "")[0]||"")).toUpperCase(); };
const shortName = n => n.replace(/ Cityplex| Parco Dora| Arthouse| Village$/g,"").replace(/^Cinema /,"");
const mapsUrl = c => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(
  [c.address ? c.name : "Cinema " + c.name, c.address, "Torino"].filter(Boolean).join(", "));

/* ---------- schede film (opzionale: data/films.json) ---------- */
let FILMS = {};
let LOGOS = {};   // opzionale: logos/index.json  →  {"ideal":"ideal.png", ...}
function filmInfo(title){
  const f = FILMS[filmKey(title)] || {};
  const q = encodeURIComponent(title.replace(/\([^)]*\)|\[[^\]]*\]/g," ").trim()+" film");
  const t = f.tmdb || null;
  const pp = t && t.poster_path;
  return {url: f.url || `https://www.google.com/search?q=${q}`, wiki: !!f.url,
    poster: pp ? "https://image.tmdb.org/t/p/w342"+pp : (f.poster || ""),
    posterBig: pp ? "https://image.tmdb.org/t/p/w780"+pp : (f.poster || ""),
    tmdb: t && t.url ? t.url : "", runtime: (t && t.runtime) || 0, director: (t && t.director) || f.director || "",
    overview: (t && t.overview) || "", genres: (t && t.genres) || [], cast: (t && t.cast) || [],
    original: (t && t.original_title) || "", title: (t && t.title) || "", year: t && t.year ? t.year : ""};
}
const xOpen = new Set();   // schede film con "Leggi tutto" aperto (trama intera, cast e link)
const cardMore = new Set();   // schede film con le linguette degli altri giorni aperte
const cardDay = new Map();   // scheda film -> giorno scelto nelle sue linguette (si azzera cambiando giorno)
/* ---------- schede comprimibili ---------- */
// Schede film: chiuse di default (si ricordano solo quelle aperte). Schede cinema: aperte di default.
const collapsed = new Set(), expanded = new Set();
try{ JSON.parse(lsGet("ct.collapsed")||"[]").forEach(k=>{ if(k[0]==="c") collapsed.add(k); }); }catch(e){}
const isFilmCard = k => k[0]==="f";
// cambiando giorno tutte le schede film tornano chiuse (e senza "Leggi tutto" né linguette dei giorni)
function resetCards(){ expanded.clear(); xOpen.clear(); cardMore.clear(); cardDay.clear(); }
const isOpen = k => (isFilmCard(k) ? (state.only || expanded.has(k)) : !collapsed.has(k)) ? " open" : "";
function saveCollapsed(){
  lsSet("ct.collapsed", JSON.stringify([...collapsed].slice(-300)));
}
function syncColAll(){

  const b = $("colall"); if(!b) return;

/* ---------- locandina a tutto schermo ---------- */
let lbOpen = false, skipPop = false;
function openLb(src, title){
  const im = $("lbimg"); im.alt = "Locandina: " + title; im.src = src;
  $("lb").hidden = false; lbOpen = true; document.body.style.overflow = "hidden";
  try{ history.pushState({...snap(), lb:1}, ""); }catch(e){}
}
function hideLb(){ $("lb").hidden = true; lbOpen = false; document.body.style.overflow = ""; $("lbimg").removeAttribute("src"); }
function closeLb(){
  if(!lbOpen) return;
  hideLb();
  try{ if(history.state && history.state.lb){ skipPop = true; history.back(); } }catch(e){ skipPop = false; }
}
$("lbx").onclick = e => { e.stopPropagation(); closeLb(); };
$("lb").addEventListener("click", e => { if(e.target.id !== "lbimg") closeLb(); });

/* ---------- navigazione interna (tasto Indietro del telefono incluso) ---------- */
const snap = () => ({view:state.view, only:state.only, onlyCinema:state.onlyCinema, day:state.day, depth:state.depth, y:window.scrollY});
function syncHist(){ try{ history.replaceState(snap(), ""); }catch(e){} }
function navigate(patch){
  syncHist();                                   // ricorda dove eri (anche lo scroll)
  Object.assign(state, patch); state.depth++;
  try{ history.pushState(snap(), ""); }catch(e){}
  render(); window.scrollTo({top:0});
}
function goBack(){
  if(state.depth > 0){ try{ history.back(); return; }catch(e){} }
  state.only = state.onlyCinema = ""; state.depth = 0; syncHist(); render();
}
window.addEventListener("popstate", e => {
  if(skipPop){ skipPop = false; return; }          // chiusura della locandina con la X: la pagina resta com'e'
  if(lbOpen){ hideLb(); return; }                 // Indietro chiude prima la locandina
  const h = e.state; if(!h) return;
  Object.assign(state, {view:h.view, only:h.only||"", onlyCinema:h.onlyCinema||"", depth:h.depth||0});
  if(h.day) state.day = h.day;
  render(); window.scrollTo({top:h.y||0});
});

/* ---------- segnaposto e loghi ---------- */
const phHtml = (title, short) => `<span class="ph" style="--h:${hue(title)}">${esc(short ? initials(title) : title.toUpperCase())}</span>`;
function phErr(img){
  const p = img.closest(".pbtn,.mini"), t = img.dataset.t || "";
  if(!p) return;
  if(p.classList.contains("pbtn")) p.outerHTML = `<span class="pbtn nop">${phHtml(t,false)}</span>`;
  else p.innerHTML = phHtml(t,true);
}
function logoErr(img){
  const p = img.parentNode; p.classList.add("mono"); p.classList.remove("big");
  p.style.setProperty("--h", hue(img.dataset.n)); p.textContent = initials(img.dataset.n);
}
/* ---------- la mia zona: ordinamento dei cinema per distanza (scelta salvata sul dispositivo, nessuna posizione letta) ---------- */
function zoneObj(){ return ZONES.find(z=>z[0]===state.zone) || null; }
function distKm(cid){
  const z = zoneObj(), c = COORDS[cid];
  if(!z || !c) return null;
  const R = 6371, rad = x=>x*Math.PI/180;
  const dLat = rad(c.lat - z[2]), dLon = rad(c.lon - z[3]);
  const a = Math.sin(dLat/2)**2 + Math.cos(rad(z[2]))*Math.cos(rad(c.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
const fmtKm = k => k < 1 ? `${Math.max(50, Math.round(k*1000/50)*50)} m` : `${k.toFixed(1).replace(".",",")} km`;
const dOf = cid => { const k = distKm(cid); return k===null ? 99 : k; };
function setupZone(){
  const has = Object.keys(COORDS).length > 0;
  $("zonebox").hidden = !has;
  if(!has) return;
  $("zone").innerHTML = `<option value="">Nessuna: ordina per orario</option>` + ZONES.map(z=>`<option value="${z[0]}"${z[0]===state.zone?" selected":""}>${esc(z[1])}</option>`).join("");
  $("zhint").textContent = state.zone ? "Cinema ordinati per distanza (in linea d’aria) dal centro della zona scelta." : "Scegli dove ti trovi per vedere prima i cinema più vicini. La scelta resta salvata su questo dispositivo.";
}
let hostCount = {};
const hostOf = c => { try{ return new URL(c.site || c.info_url).host; }catch(e){ return ""; } };
function logoHtml(c){
  const mono = `<span class="logo mono" style="--h:${hue(c.name)}">${esc(initials(c.name))}</span>`;
  const local = LOGOS[c.id];
  if(local) return `<span class="logo big"><img src="logos/${esc(local)}" alt="" data-n="${esc(c.name)}" onerror="logoErr(this)"></span>`;
  const h = hostOf(c);
  if(!h || hostCount[h] > 1) return mono;          // sito condiviso da più cinema: il logo sarebbe quello sbagliato
  return `<span class="logo"><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=128" alt="" data-n="${esc(c.name)}" onerror="logoErr(this)"></span>`;
}
function posterHtml(title, i){
  if(!i.poster) return `<span class="pbtn nop">${phHtml(title,false)}</span>`;
  return `<button type="button" class="pbtn" data-lb="${esc(i.posterBig||i.poster)}" data-t="${esc(title)}" aria-label="Ingrandisci la locandina di ${esc(title)}">`
    + `<img src="${esc(i.poster)}" alt="" data-t="${esc(title)}" loading="lazy" referrerpolicy="no-referrer" onerror="phErr(this)"></button>`;
}
function miniHtml(title, i){
  return `<span class="mini">${i.poster ? `<img src="${esc(i.poster)}" alt="" data-t="${esc(title)}" loading="lazy" referrerpolicy="no-referrer" onerror="phErr(this)">` : phHtml(title,true)}</span>`;
}

function infoTop(i, title){

const addrLink = c => { const k = distKm(c.id); const km = k===null ? "" : ` · ${fmtKm(k)}`;
  return `<a class="addr" href="${esc(mapsUrl(c))}" target="_blank" rel="noopener" title="Apri in Maps">${esc(c.address || "Apri in Maps")}${km}</a>`; };

/* ---------- dati ---------- */
let lastLoad = 0;
// ricarica i dati dal server (senza cache); usata all'apertura e quando la pagina torna in primo piano
async function refreshData(){
  const bust = "?t=" + Date.now();
  try{
    const r = await fetch("data/showtimes.json"+bust,{cache:"no-store"});
    if(!r.ok) return false;
    const j = await r.json();
    const changed = !state.data || state.data.generated_at !== j.generated_at;
    state.data = j; lastLoad = Date.now();
    try{ const r2 = await fetch("data/films.json"+bust,{cache:"no-store"}); if(r2.ok) FILMS = await r2.json(); }catch(e){}
    return changed;
  }catch(e){ return false; }
}
async function load(){
  try{ const r = await fetch("data/films.json?t="+Date.now(),{cache:"no-store"}); if(r.ok) FILMS = await r.json(); }catch(e){}
  try{ const r = await fetch("logos/index.json",{cache:"no-store"}); if(r.ok) LOGOS = await r.json(); }catch(e){}
  try{
    if(!(await refreshData()) && !state.data) throw new Error("nodata");
  }catch(e){
    $("out").innerHTML = `<div class="empty"><b>Dati non ancora disponibili</b>Il file data/showtimes.json non è stato trovato. Se hai appena pubblicato il sito, avvia una volta il workflow “Aggiorna programmazione” dalla scheda Actions del repository.</div>`;
    return;
  }
  hostCount = {};
  for(const c of state.data.cinemas){ const h = hostOf(c); if(h) hostCount[h] = (hostCount[h]||0) + 1; }
  const saved = lsGet("ct.hidden"); if(saved) try{ state.hidden = new Set(JSON.parse(saved)); }catch(e){}
  state.view = lsGet("ct.view") || "film";
  state.zone = lsGet("ct.zone") || "";
  if(!ZONES.some(z=>z[0]===state.zone)) state.zone = "";
  try{ const r = await fetch("data/coordinates.json?t="+Date.now(),{cache:"no-store"}); if(r.ok) COORDS = await r.json(); }catch(e){}
  setupZone();
  state.fromNow = lsGet("ct.fromnow") !== "0";
  $("fromnow").checked = state.fromNow;
  buildChips(); render(); syncHist();
}

function buildChips(){
  const box = $("cchips"); box.innerHTML = "";
  for(const c of state.data.cinemas){
    const b = document.createElement("button");
    b.className="chip"; b.textContent=c.name; b.dataset.id=c.id;
    b.setAttribute("aria-pressed", String(!state.hidden.has(c.id)));
    b.onclick = () => { state.hidden.has(c.id) ? state.hidden.delete(c.id) : state.hidden.add(c.id);
      lsSet("ct.hidden", JSON.stringify([...state.hidden])); buildChips(); render(); };
    box.appendChild(b);
  }
  const all = document.createElement("button"); all.className="link"; all.textContent="Tutti";
  all.onclick = () => { state.hidden.clear(); lsSet("ct.hidden","[]"); buildChips(); render(); };
  const none = document.createElement("button"); none.className="link"; none.textContent="Nessuno";
  none.onclick = () => { state.hidden = new Set(state.data.cinemas.map(c=>c.id)); lsSet("ct.hidden", JSON.stringify([...state.hidden])); buildChips(); render(); };
  box.append(all,none);
  const shown = state.data.cinemas.length - state.hidden.size;
  $("fsum").textContent = shown === state.data.cinemas.length ? "· tutti" : `· ${shown} su ${state.data.cinemas.length}`;
}

/* ---------- rendering ---------- */
function timePills(list, now, isToday){
  let nextMarked = false;
  return list.map(s=>{
    const isPast = isToday && effMin(s.time) < now.min - 10;
    let cls = "t";
    if(isPast) cls += " past";
    else if(isToday && !nextMarked){ cls += " next"; nextMarked = true; }
    const vo = s.tag==="VO" ? "<sup>VO</sup>" : "";
    const hallTxt = s.hall || (s.tag && s.tag!=="VO" ? s.tag : "");
    const extra = hallTxt ? `<i>${esc(hallTxt)}</i>` : "";
    const room = s.room ? `<i title="Sala ${esc(s.room)}">S${esc(s.room)}</i>` : "";
    return `<span class="${cls}">${s.time}${vo}${room}${extra}</span>`;
  }).join("");
}

// anteprima da scheda chiusa: i prossimi 3 spettacoli (con il cinema) + quanti ne restano
function previewHtml(byCinema, cmap, now, isToday){
  const items = [];
  byCinema.forEach((arr,cid)=>arr.forEach(s=>items.push({s,cid})));
  items.sort((a,b)=>(dOf(a.cid)-dOf(b.cid)) || (effMin(a.s.time)-effMin(b.s.time)));
  let pool = isToday ? items.filter(x=>effMin(x.s.time) >= now.min - 10) : items;
  if(!pool.length) pool = items;
  const shown = pool.slice(0,3);
  const pills = shown.map((x,n)=>{
    const c = cmap[x.cid] || {name:x.cid};
    const isNext = isToday && !state.zone && n===0 && effMin(x.s.time) >= now.min - 10;
    return `<span class="pp${isNext?" next":""}"><b>${x.s.time}</b>${x.s.tag==="VO"?"<sup>VO</sup>":""}<em>${esc(shortName(c.name))}</em></span>`;
  }).join("");
  const rest = items.length - shown.length, nc = byCinema.size;
  const txt = (rest>0 ? `+${rest} orari · ` : "") + `${nc} ${nc===1?"cinema":"cinema"}`;
  return `<div class="prev">${pills}<span class="pm">${txt}</span></div>`;
}

function render(){
  const d = state.data; if(!d) return;
  const now = romeNow();
  const today = now.date;
  const dates = [...new Set(d.showtimes.map(s=>s.date))].filter(x=>x>=today).sort();
  if(!dates.includes(today)) dates.unshift(today);
  if(!state.day || !dates.includes(state.day)) state.day = today;
  state.dates = dates;
  const isToday = state.day === today;

  // Barra dei giorni: una settimana alla volta (7 colonne fisse, niente scorrimento)
  const addDays = (iso,n)=>{ const x=new Date(iso+"T12:00:00Z"); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
  const diff = Math.round((new Date(state.day+"T12:00:00Z") - new Date(today+"T12:00:00Z"))/864e5);
  const start = addDays(today, 7*Math.floor(diff/7));
  const week = Array.from({length:7},(_,n)=>addDays(start,n));
  const hasNext = dates.some(x=>x>week[6]);
  const fmt = (iso,o)=>new Intl.DateTimeFormat("it-IT",{timeZone:"UTC",...o}).format(new Date(iso+"T12:00:00Z"));
  const range = `${new Date(week[0]+"T12:00:00Z").getUTCDate()}–${new Date(week[6]+"T12:00:00Z").getUTCDate()} ${fmt(week[6],{month:"short"}).replace(".","")}`;
  $("days").innerHTML = `<div class="wk"><button type="button" class="link" data-wk="-1"${start===today?" hidden":""}>‹ Prima</button>`
    + `<span>${start===today?"Questa settimana":"Settimana"} · ${esc(range)}</span>`
    + `<button type="button" class="link" data-wk="1"${hasNext?"":" hidden"}>Più avanti ›</button></div>`
    + `<div class="dgrid">${week.map(x=>{
        const has = dates.includes(x), wd = fmt(x,{weekday:"short"}).replace(".","");
        return `<button type="button" class="dc" data-d="${x}" aria-pressed="${x===state.day}"${has?"":" disabled"}><span>${x===today?"Oggi":esc(wd.charAt(0).toUpperCase()+wd.slice(1))}</span><b>${new Date(x+"T12:00:00Z").getUTCDate()}</b></button>`;
      }).join("")}</div>`;
  const setDay = x=>{ state.anim = x > state.day ? "l" : "r"; state.day = x; resetCards(); render(); };
  const g0 = new Date(d.generated_at), ageMin = isNaN(g0) ? null : Math.max(0, Math.round((Date.now() - g0)/60000));
  if(ageMin !== null){
    const hhmm = new Intl.DateTimeFormat("it-IT",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}).format(g0);
    const gd = new Intl.DateTimeFormat("en-CA",{timeZone:TZ}).format(g0);
    const when = gd===today ? `alle ${hhmm}` : `${new Intl.DateTimeFormat("it-IT",{timeZone:TZ,day:"numeric",month:"short"}).format(g0)} alle ${hhmm}`;
    const ago = ageMin < 60 ? "meno di un’ora fa" : ageMin < 120 ? "1 ora fa" : ageMin < 1440 ? `${Math.floor(ageMin/60)} ore fa` : (ageMin < 2880 ? "1 giorno fa" : `${Math.floor(ageMin/1440)} giorni fa`);
    $("days").insertAdjacentHTML("beforeend", `<div class="updl${ageMin>=360?" old":""}">Orari aggiornati ${esc(when)} · ${esc(ago)}</div>`);
  }
  $("days").querySelectorAll("button[data-d]").forEach(b=>b.onclick=()=>setDay(b.dataset.d));
  $("days").querySelectorAll("button[data-wk]").forEach(b=>b.onclick=()=>{
    const ws = addDays(start, 7*(+b.dataset.wk)), we = addDays(ws,6);
    setDay(dates.find(x=>x>=ws && x<=we) || ws);      // primo giorno con programmazione di quella settimana
  });
  $("v-film").setAttribute("aria-pressed", String(state.view==="film"));
  $("v-cinema").setAttribute("aria-pressed", String(state.view==="cinema"));
  $("b-q").classList.toggle("on", !!state.q);
  $("b-m").classList.toggle("on", state.hidden.size>0 || !state.fromNow || !!state.zone);

  const g = new Date(d.generated_at);
  const gDay = isNaN(g) ? "" : new Intl.DateTimeFormat("en-CA",{timeZone:TZ}).format(g);
  $("upd").textContent = isNaN(g) ? "" : "Aggiornato " + new Intl.DateTimeFormat("it-IT",
    gDay===today ? {timeZone:TZ,hour:"2-digit",minute:"2-digit"} : {timeZone:TZ,day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(g);

  const cmap = Object.fromEntries(d.cinemas.map(c=>[c.id,c]));
  const q = filmKey(state.q);
  let rows = d.showtimes.filter(s => s.date===state.day && !state.hidden.has(s.cinema) && (!q || filmKey(s.film).includes(q)) && (!state.only || filmKey(s.film)===state.only) && (!state.onlyCinema || s.cinema===state.onlyCinema));
  if(isToday && state.fromNow) rows = rows.filter(s => effMin(s.time) >= now.min - 10);
  // tutti i giorni di ogni film (per le linguette dei giorni nella scheda film)
  const all = new Map();
  for(const s of d.showtimes){
    if(s.date < today || state.hidden.has(s.cinema)) continue;
    const k = filmKey(s.film);
    if((q && !k.includes(q)) || (state.only && k!==state.only) || (state.onlyCinema && s.cinema!==state.onlyCinema)) continue;
    if(!all.has(k)) all.set(k,new Map());
    const m = all.get(k); if(!m.has(s.date)) m.set(s.date,[]); m.get(s.date).push(s);
  }

  const warns = d.cinemas.filter(c=>!state.hidden.has(c.id) && (c.status.stale || (!c.status.ok && !c.status.n) ));
  let html = "";
  const broken = warns.filter(c=>c.status.stale).map(c=>c.name);
  const missing = warns.filter(c=>!c.status.stale).map(c=>c.name);
  if(broken.length) html += `<div class="warn">Orari non aggiornati (sito non raggiungibile all’ultimo controllo): ${esc(broken.join(", "))}.</div>`;
  if(missing.length) html += `<div class="warn">Programmazione non rilevata automaticamente per: ${missing.map(n=>{const c=d.cinemas.find(x=>x.name===n);const u=c.site||c.info_url;return u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`:esc(n)}).join(", ")}.</div>`;

  if(!isToday){
    const todayOnly = d.cinemas.filter(c=>!state.hidden.has(c.id) && c.status && c.status.source==="Movieplayer");
    if(todayOnly.length) html += `<div class="warn">Per questo giorno non è disponibile la programmazione di: ${todayOnly.map(c=>{const u=c.site||c.info_url;return u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(c.name)}</a>`:esc(c.name)}).join(", ")}. Di questi cinema leggiamo solo gli orari di oggi: controlla sul sito ufficiale.</div>`;
  }
  if(state.only || state.onlyCinema){
    const nm = state.only ? d.showtimes.find(s=>filmKey(s.film)===state.only) : null;
    const label = state.only ? (nm?prettyTitle(nm.film):state.only) : ((cmap[state.onlyCinema]||{}).name || state.onlyCinema);
    html += `<div class="only"><button type="button" data-back="1">← Indietro</button><span>Solo: <b>${esc(label)}</b></span><button type="button" data-clear="1">Mostra tutti ✕</button></div>`;
  }
  if(state.view==="film") html += renderFilms(rows, cmap, now, isToday, all, today);
  else html += renderCinemas(rows, d, now, isToday);
  $("out").innerHTML = html;
  syncColAll();

  const sources = [...new Set(d.cinemas.map(c=>c.status.source).filter(Boolean))];
  const hasTmdb = Object.values(FILMS).some(f=>f && f.tmdb);
  $("foot").innerHTML = `Fonti: ${esc(sources.join(", ")||"—")}. Gli orari possono cambiare: verifica sul sito del cinema prima di uscire.`
    + `<br>Creato da ${REPO_URL ? `<a href="${esc(REPO_URL)}" target="_blank" rel="noopener">rotulair</a> · <a href="${esc(REPO_URL)}" target="_blank" rel="noopener">codice su GitHub</a>` : "rotulair"}`
    + (hasTmdb ? `<br>Locandine, durate e registi: <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a> e Wikipedia. This product uses the TMDB API but is not endorsed or certified by TMDB.` : "");
  if(state.anim){ const o=$("out"); o.classList.remove("sl","sr"); void o.offsetWidth; o.classList.add(state.anim==="l"?"sl":"sr"); state.anim=""; }
}

function renderFilms(rows, cmap, now, isToday, all, today){
  if(!rows.length) return emptyMsg(isToday);
  const films = new Map();
  for(const s of rows){
    const k = filmKey(s.film);
    if(!films.has(k)) films.set(k,{title:s.film, byCinema:new Map()});
    const f = films.get(k);
    if(s.film !== s.film.toUpperCase()) f.title = s.film;   // preferisci la versione non tutta maiuscola
    if(!f.byCinema.has(s.cinema)) f.byCinema.set(s.cinema,[]);
    f.byCinema.get(s.cinema).push(s);
  }
  const list = [...films.values()].map(f=>{
    f.byCinema.forEach(a=>a.sort((x,y)=>effMin(x.time)-effMin(y.time)));
    f.first = Math.min(...[...f.byCinema.values()].map(a=>effMin(a[0].time)));
    f.title = prettyTitle(f.title);
    return f;
  }).sort((a,b)=> a.first-b.first || a.title.localeCompare(b.title,"it"));

  return list.map(f=>{
    const k = filmKey(f.title);
    const perDay = all.get(k) || new Map();
    const days = [...perDay.keys()].sort();
    let sel = cardDay.get(k); if(!days.includes(sel)) sel = state.day;
    const selToday = sel === today;
    let byCinema = f.byCinema;
    if(sel !== state.day){
      byCinema = new Map();
      for(const s of perDay.get(sel)||[]){
        if(selToday && state.fromNow && effMin(s.time) < now.min - 10) continue;
        if(!byCinema.has(s.cinema)) byCinema.set(s.cinema,[]);
        byCinema.get(s.cinema).push(s);
      }
      byCinema.forEach(a=>a.sort((x,y)=>effMin(x.time)-effMin(y.time)));
    }
    const n = byCinema.size;
    const openTabs = cardMore.has(k);
    const dbar = `<div class="dbar"><span>${esc(dayLabel(sel,today))} · ${n} cinema</span>`
      + (days.length > 1 ? `<button type="button" class="link altri" data-cmore="${esc(k)}" aria-expanded="${openTabs}">Altri giorni ${openTabs?"▴":"▾"}</button>` : "") + `</div>`
      + (days.length > 1 && openTabs ? `<div class="dtabs" role="group" aria-label="Giorni di programmazione">${days.map(x=>`<button type="button" class="dt" data-cd="${esc(k)}" data-date="${x}" aria-pressed="${x===sel}">${esc(dayLabel(x,today))}</button>`).join("")}</div>` : "");
    const rowsHtml = n ? [...byCinema.entries()].sort((a,b)=>(dOf(a[0])-dOf(b[0])) || (effMin(a[1][0].time)-effMin(b[1][0].time))).map(([cid,arr])=>{
      const c = cmap[cid]; const link = c.site || c.info_url;
      const name = `<a class="cn" href="#cinema" data-cinema="${esc(cid)}" title="Tutta la programmazione di questo cinema">${esc(c.name)}</a>`
        + (link ? ` <a class="ext" href="${esc(link)}" target="_blank" rel="noopener" title="Sito ufficiale" aria-label="Sito ufficiale">↗</a>` : "")
        + addrLink(c);
      return `<div class="row"><div class="who">${name}</div><div class="times">${timePills(arr,now,selToday)}</div></div>`;
    }).join("") : `<div class="none">Nessuna proiezione in questo giorno con i filtri attuali.</div>`;
    const i = filmInfo(f.title);
    const flat = [...perDay.values()].flat();
    const regia = (flat.find(s=>s.regia)||{}).regia || i.director || "";
    const year = i.year || (flat.find(s=>s.anno)||{}).anno || "";
    const dir = regia ? `<div class="dir"><span class="lab">REGIA</span><b>${esc(regia)}</b></div>` : "";
    const meta = [i.runtime ? `${i.runtime}\u00a0min` : "", i.genres.slice(0,2).join(", ")].filter(Boolean).map(esc).join(" · "); const metaH = meta ? `<div class="meta">${meta}</div>` : "";
    return `<details class="card${xOpen.has(k)?" xo":""}" data-k="f:${esc(k)}"${isOpen("f:"+k)}><summary class="fh">${posterHtml(f.title,i)}`
      + `<div class="fm"><h2>${esc(i.title||f.title)}${year?`<span class="yr">${esc(year)}</span>`:""}</h2>${dir}${metaH}</div>${plotHtml(i, xOpen.has(k))}${previewHtml(f.byCinema,cmap,now,isToday)}</summary>`
      + `${infoTop(i,f.title)}${infoBottom(i)}${dbar}${rowsHtml}</details>`;
  }).join("");
}

function renderCinemas(rows, d, now, isToday){
  const by = new Map();
  for(const s of rows){ if(!by.has(s.cinema)) by.set(s.cinema,new Map());
    const m = by.get(s.cinema), k = filmKey(s.film);
    if(!m.has(k)) m.set(k,{title:prettyTitle(s.film),arr:[]}); m.get(k).arr.push(s); }
  let out = "";
  for(const c of [...d.cinemas].sort((a,b)=>dOf(a.id)-dOf(b.id))){
    if(state.hidden.has(c.id) || (state.onlyCinema && c.id!==state.onlyCinema)) continue;
    const films = by.get(c.id);
    if(!films && (state.q || state.only)) continue;
    const link = c.site || c.info_url;
    let body;
    if(!films) body = `<div class="none" style="border-top:1px solid var(--line);padding-top:14px">${c.status.stale?"Orari non aggiornati.":(c.status.ok?"Nessuna proiezione trovata per questo giorno.":"Programmazione non rilevata automaticamente.")}</div>`;
    else body = [...films.values()].sort((a,b)=>effMin(a.arr[0].time)-effMin(b.arr[0].time)).map(f=>{
      f.arr.sort((x,y)=>effMin(x.time)-effMin(y.time));
      const fi = filmInfo(f.title);
      return `<div class="row"><div class="who mw">${miniHtml(f.title,fi)}<div>${cinemaFilmLink(f.title, fi.title)}</div></div><div class="times">${timePills(f.arr,now,isToday)}</div></div>`;
    }).join("");
    const note = c.status && c.status.source==="Movieplayer" ? `<span class="addr" style="text-decoration:none">orari da Movieplayer, solo oggi: verifica sul sito</span>` : "";
    out += `<details class="card cin" data-k="c:${esc(c.id)}"${isOpen("c:"+c.id)}><summary class="fh chd">${logoHtml(c)}`
      + `<div class="fm"><h2>${esc(c.name)}</h2>${addrLink(c)}${link?`<a class="site" href="${esc(link)}" target="_blank" rel="noopener">Sito ufficiale ↗</a>`:""}${note}</div></summary>${body}</details>`;
  }
  return out || emptyMsg(isToday);
}

function emptyMsg(isToday){
  return `<div class="empty"><b>Nessuna proiezione</b>${isToday&&state.fromNow?"Per oggi non ci sono più spettacoli con questi filtri. Togli “Solo da ora” o scegli un altro giorno.":"Prova a cambiare giorno, ricerca o cinema selezionati."}</div>`;
}

/* ---------- eventi ---------- */
$("v-film").onclick = () => { state.only=state.onlyCinema=""; state.depth=0; state.view="film"; lsSet("ct.view","film"); syncHist(); render(); };
$("v-cinema").onclick = () => { state.only=state.onlyCinema=""; state.depth=0; state.view="cinema"; lsSet("ct.view","cinema"); syncHist(); render(); };
function togglePanel(which){
  const map = {q:["b-q","p-q"], m:["b-m","p-m"]};
  for(const [k,[b,p]] of Object.entries(map)){
    const open = k===which && $(p).hidden;
    $(p).hidden = !open; $(b).setAttribute("aria-expanded", String(open));
  }
  if(which==="q" && !$("p-q").hidden) $("q").focus();
}
$("b-q").onclick = () => togglePanel("q");
$("b-m").onclick = () => togglePanel("m");
$("q").addEventListener("input", e => { state.q = e.target.value; state.only=state.onlyCinema=""; render(); });
$("out").addEventListener("toggle", e => {
  const d = e.target; if(!d.dataset || !d.dataset.k) return;
  const k = d.dataset.k;
  if(d.open === (isOpen(k) !== "")){ syncColAll(); return; }   // evento causato dal disegno della pagina, non da un tocco
  if(isFilmCard(k)){
    if(d.open) expanded.add(k);
    else{ const fk = k.slice(2); expanded.delete(k); xOpen.delete(fk);
      const dirty = cardMore.delete(fk) | cardDay.delete(fk);          // linguette e giorno scelto tornano com'erano
      if(dirty){ setTimeout(render, 0); return; }
      d.classList.remove("xo"); const mo = d.querySelector("[data-more]"); if(mo) mo.textContent = "Leggi tutto";
      const pl = d.querySelector(".plot"); if(pl) pl.classList.toggle("full", pl.textContent.length <= 110); }
  }
  else { d.open ? collapsed.delete(k) : collapsed.add(k); }
  saveCollapsed(); syncColAll();
}, true);
$("colall").onclick = () => {
  const all = [...document.querySelectorAll("#out details.card")];
  const open = all.some(d=>d.open);
  all.forEach(d=>{ d.open = !open; });   // il gestore "toggle" aggiorna lo stato salvato
};
$("out").addEventListener("click", e => {
  const lb = e.target.closest("[data-lb]");
  if(lb){ e.preventDefault(); e.stopPropagation(); openLb(lb.dataset.lb, lb.dataset.t || ""); return; }
  const a = e.target.closest("[data-film]");
  if(a){ e.preventDefault(); navigate({only:a.dataset.film, onlyCinema:"", view:"film"}); return; }
  const cn = e.target.closest("[data-cinema]");
  if(cn){ e.preventDefault(); collapsed.delete("c:"+cn.dataset.cinema); saveCollapsed(); navigate({onlyCinema:cn.dataset.cinema, only:"", view:"cinema"}); return; }
  if(e.target.closest("[data-back]")){ goBack(); return; }
  if(e.target.closest("[data-clear]")){ state.only=state.onlyCinema=""; state.depth=0; syncHist(); render(); return; }
  const mo = e.target.closest("[data-more]");
  if(mo){
    e.preventDefault();
    const card = mo.closest("details"), k = card.dataset.k.slice(2), op = card.classList.toggle("xo");
    op ? xOpen.add(k) : xOpen.delete(k);
    const pl = card.querySelector(".plot");
    if(pl) pl.classList.toggle("full", op || pl.textContent.length <= 110);
    mo.textContent = op ? "Mostra meno" : "Leggi tutto"; return;
  }
  const t = e.target.closest("[data-cd]");
  if(t){ e.preventDefault(); cardDay.set(t.dataset.cd, t.dataset.date); render(); return; }
  const cm = e.target.closest("[data-cmore]");
  if(cm){ e.preventDefault(); const k = cm.dataset.cmore; cardMore.has(k) ? cardMore.delete(k) : cardMore.add(k); render(); }
});

/* ---------- scorrimento orizzontale tra i giorni ---------- */
function gotoDay(step){
  const j = state.dates.indexOf(state.day) + step;
  if(j < 0 || j >= state.dates.length) return;
  state.anim = step > 0 ? "l" : "r";
  state.day = state.dates[j]; resetCards(); render();
  window.scrollTo({top:0});
}
let tx = 0, ty = 0, tok = false;
document.addEventListener("touchstart", e => {
  const t = e.touches[0]; tx = t.clientX; ty = t.clientY;
  tok = e.touches.length === 1 && !lbOpen && !e.target.closest(".dtabs,#days,.panel,input");
}, {passive:true});
document.addEventListener("touchend", e => {
  if(!tok) return; tok = false;
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if(Math.abs(dx) < 70 || Math.abs(dx) < 1.8*Math.abs(dy)) return;
  gotoDay(dx < 0 ? 1 : -1);
}, {passive:true});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && lbOpen){ closeLb(); return; }
  if(lbOpen || (e.target.closest && e.target.closest("input"))) return;
  if(e.key === "ArrowRight") gotoDay(1); else if(e.key === "ArrowLeft") gotoDay(-1);
});
$("zone").addEventListener("change", e => { state.zone = e.target.value; lsSet("ct.zone", state.zone); setupZone(); render(); });
$("fromnow").addEventListener("change", e => { state.fromNow = e.target.checked; lsSet("ct.fromnow", e.target.checked?"1":"0"); render(); });
// il browser del telefono riapre spesso la pagina "congelata": se i dati hanno più di 5 minuti li riscarico
async function wake(){
  if(!state.data) return;
  if(Date.now() - lastLoad > 5*60*1000){ if(await refreshData()){ buildChips(); } }
  render();
}
document.addEventListener("visibilitychange", () => { if(!document.hidden) wake(); });
window.addEventListener("pageshow", e => { if(e.persisted) wake(); });
window.addEventListener("focus", () => wake());
setInterval(()=>{ if(state.data && !document.hidden) render(); }, 60000);
load();
</script>

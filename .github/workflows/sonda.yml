name: Sonda alternative UCI e The Space (una tantum)
on: workflow_dispatch
jobs:
  esplora:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y poppler-utils || true
      - run: python scraper/sonda.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonda
          path: out/sonda/
          retention-days: 7

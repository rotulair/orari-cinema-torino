name: Aggiorna programmazione

on:
schedule:
 # 6 volte al giorno (orario UTC): 02:20, 08:20, 11:20, 14:20, 16:20, 19:20 
    # Corrispondono in Italia (inverno) a: 03:20, 09:20, 12:20, 15:20, 17:20, 20:20
    - cron: "20 2,8,11,14,16,19 * * *"
  workflow_dispatch: {}          # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test dei parser
        run: python -m unittest discover -s tests

      - name: Scarica la programmazione
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python scraper/scrape.py --debug-dir debug

      - name: Salva l'HTML scaricato se qualcosa va storto
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-debug
          path: debug/
          retention-days: 7

      - name: Pubblica i dati aggiornati
        run: |
          git config user.name  "cinema-torino-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/showtimes.json data/films.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Aggiornamento programmazione $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
